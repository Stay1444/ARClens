[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Stay1444/ARClens"

[workspace.dependencies]
# Internal
arclens-capture = { path = "crates/arclens-capture" }
arclens-core = { path = "crates/arclens-core" }
arclens-data = { path = "crates/arclens-data" }
arclens-hotkeys = { path = "crates/arclens-hotkeys" }
arclens-i18n = { path = "crates/arclens-i18n" }
arclens-ipc = { path = "crates/arclens-ipc" }
arclens-ui = { path = "crates/arclens-ui" }
arclens-vision = { path = "crates/arclens-vision" }

# External — keep alphabetical, versions pinned to minor.
anyhow = "1.0"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
# Benchmarks only (dev-dependency); no plots or rayon.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
directories = "6.0"
flate2 = "1.1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
futures = "0.3"
iced = { version = "0.14", default-features = false, features = ["wgpu", "wayland", "x11", "canvas", "tokio", "image-without-codecs", "svg"] }
# Decoders for iced's image widget: item icons are PNG only.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
iced_layershell = "0.19"
nucleo-matcher = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
sys-locale = "0.3"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisy for this codebase:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Hard rules:
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Pixel loops are ~100× slower unoptimised; keep fixture tests fast in debug.
[profile.dev.package.arclens-vision]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
# The map tracker's FFTs.
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.transpose]
opt-level = 3
[profile.dev.package.strength_reduce]
opt-level = 3

# Full debug info for ~600 dependencies is tens of GB and slows linking;
# keep it for our own crates only.
[profile.dev.package."*"]
debug = "line-tables-only"
