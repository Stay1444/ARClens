[package]
name = "arclens-capture"
description = "Screen capture for ARClens: XDG ScreenCast portal + PipeWire on Linux, Windows Graphics Capture on Windows"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"

[lints]
workspace = true
