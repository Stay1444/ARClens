[package]
name = "arclens-overlay"
description = "ARClens in-game overlay: layer-shell surface on Linux, topmost window on Windows"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
arclens-core = { workspace = true }
arclens-ipc = { workspace = true }
arclens-ui = { workspace = true }
futures = { workspace = true }
iced = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
iced_layershell = { workspace = true }
# Same versions iced_layershell uses; only for listing outputs.
smithay-client-toolkit = "0.20"
wayland-client = "0.31"

[target.'cfg(windows)'.dependencies]
mouse_position = "0.1"

[lints]
workspace = true
