name: Release

# Builds the AppImage and the Flatpak bundle. On a `v*` tag they are
# attached to a GitHub release; a manual run keeps them as workflow
# artifacts only.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    # Oldest supported LTS: the AppImage then runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev libpipewire-0.3-dev libclang-dev pkg-config file desktop-file-utils
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: appimage
    - name: Build AppImage
      run: |
        version="${GITHUB_REF_NAME#v}"
        if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="$(git rev-parse --short HEAD)"; fi
        VERSION="$version" packaging/appimage/build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: appimage
        path: ARClens-*-x86_64.AppImage
        if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: ARClens-x86_64.flatpak
        manifest-path: packaging/flatpak/io.github.Stay1444.ARClens.yml
        cache-key: flatpak-builder-${{ github.sha }}
        upload-artifact: false
    - uses: actions/upload-artifact@v4
      with:
        name: flatpak
        path: ARClens-x86_64.flatpak
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [ appimage, flatpak ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
