name: Release

# Builds the AppImage, the Flatpak bundle and a Windows zip. On a `v*` tag they are
# attached to a GitHub release. A manual run keeps them as workflow
# artifacts only, unless given a `tag`: then it publishes the release and
# creates the tag on the commit it built.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (e.g. v0.2.0); empty: build only"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # The release's tag: the pushed tag, or the manual run's input.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  appimage:
    # Oldest LTS whose PipeWire headers (1.0) the pipewire crate builds
    # against; the AppImage needs glibc >= 2.39.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev libpipewire-0.3-dev libclang-dev pkg-config file desktop-file-utils
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: appimage
    - name: Build AppImage
      run: |
        version="${RELEASE_TAG#v}"
        if [ -z "${RELEASE_TAG}" ]; then version="$(git rev-parse --short HEAD)"; fi
        VERSION="$version" packaging/appimage/build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: appimage
        path: ARClens-*-x86_64.AppImage
        if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: ARClens-x86_64.flatpak
        manifest-path: packaging/flatpak/io.github.Stay1444.ARClens.yml
        cache-key: flatpak-builder-${{ github.sha }}
        upload-artifact: false
    - uses: actions/upload-artifact@v4
      with:
        name: flatpak
        path: ARClens-x86_64.flatpak
        if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        key: windows-release
    - name: Build
      run: cargo build --release --locked -p arclens -p arclens-overlay
    - name: Zip
      shell: pwsh
      run: |
        $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { (git rev-parse --short HEAD) }
        New-Item -ItemType Directory -Force ARClens | Out-Null
        Copy-Item target/release/arclens.exe, target/release/arclens-overlay.exe, README.md ARClens/
        Compress-Archive -Path ARClens -DestinationPath "ARClens-$version-windows-x86_64.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: ARClens-*-windows-x86_64.zip
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: [ appimage, flatpak, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    # Hand-written notes for the tag if there are any, then the generated
    # list of changes.
    - name: Release notes
      run: |
        notes="packaging/release-notes/${RELEASE_TAG}.md"
        if [ -f "$notes" ]; then cp "$notes" notes.md; else : > notes.md; fi
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        # A manual run creates the tag here, on the commit it built.
        target_commitish: ${{ github.sha }}
        name: ARClens ${{ env.RELEASE_TAG }}
        files: dist/*
        body_path: notes.md
        generate_release_notes: true
