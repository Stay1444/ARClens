name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies (apps)
      run: |
        sudo apt-get update
        sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev libpipewire-0.3-dev libclang-dev pkg-config
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --workspace --locked
    - name: Build apps
      run: cargo build --workspace --locked
