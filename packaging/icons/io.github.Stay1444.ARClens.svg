<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252d39"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ae6f8"/>
      <stop offset="1" stop-color="#1c97bd"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#3cc8e6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3cc8e6" stop-opacity="0.05"/>
    </radialGradient>
    <clipPath id="inside"><circle cx="56" cy="56" r="27"/></clipPath>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <!-- handle -->
  <path d="M80 80 L102 102" stroke="#0d1015" stroke-width="20" stroke-linecap="round"/>
  <path d="M80 80 L102 102" stroke="url(#lens)" stroke-width="13" stroke-linecap="round"/>
  <!-- glass with a faint map grid -->
  <circle cx="56" cy="56" r="27" fill="url(#glass)"/>
  <g clip-path="url(#inside)" stroke="#3cc8e6" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M28 44H84M28 58H84M28 72H84M42 28V84M56 28V84M70 28V84"/>
  </g>
  <!-- the arc, a raider's route across the map -->
  <path d="M33 71 Q50 38 80 42" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 7" clip-path="url(#inside)"/>
  <!-- map pin -->
  <path d="M56 70 C49 61 45 56 45 50 A11 11 0 0 1 67 50 C67 56 63 61 56 70Z" fill="url(#pin)" stroke="#0d1015" stroke-width="2"/>
  <circle cx="56" cy="50" r="4" fill="#14171c"/>
  <!-- lens rim -->
  <circle cx="56" cy="56" r="31" fill="none" stroke="url(#lens)" stroke-width="9"/>
</svg>
